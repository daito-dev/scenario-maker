<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Driving Scenario Design Tool</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>

  <body>
    <div id="layout">
      <!-- ===== Left Panel ===== -->
      <div id="leftPanel">
        <h2>Scenario Settings</h2>

        <label>
          Number of Lanes (1–6):
          <input id="lanesInput" type="number" min="1" max="6" value="2" />
        </label>

        <label>
          Total Distance (m):
          <input
            id="distanceInput"
            type="number"
            min="100"
            max="5000"
            step="50"
            value="500"
          />
        </label>

        <button id="resetButton">Reset</button>
        <button id="openCameraDialog">Advanced Settings</button>
        <button id="exportPdfButton">Export PDF</button>

        <hr />

        <!-- Vehicle panels are generated dynamically by main.ts -->
        <div id="vehiclePanelsContainer"></div>
      </div>


      <!-- ===== Canvas Area ===== -->
      <div id="canvasContainer">
        <canvas id="scenarioCanvas" width="900" height="200"></canvas>
      </div>
    </div>

    <!-- ===== Advanced Settings Modal ===== -->
    <div id="cameraModal" class="modal">
      <div class="modal-content">
        <h2>Advanced Settings</h2>

        <!-- Road Settings -->
        <div class="modal-group road-group">
          <h3 class="modal-group-title">Road Settings</h3>
          <label>Road Width [m]:
            <input id="road-width" type="number" step="0.1" value="3.5" />
          </label>
        </div>

        <!-- Camera Settings Box -->
        <div class="modal-group camera-group">
          <div class="camera-grid">

            <!-- Left Column -->
            <div class="camera-col">
              <h3 class="camera-col-title">Camera Settings</h3>

              <label>Location X [m]: <input id="cam-loc-x" type="number" step="0.001" value="2.050" /></label>
              <label>Location Y [m]: <input id="cam-loc-y" type="number" step="0.001" value="0.000" /></label>
              <label>Location Z [m]: <input id="cam-loc-z" type="number" step="0.001" value="1.300" /></label>

              <label>Bank [deg]: <input id="cam-bank" type="number" step="0.01" value="0.0" /></label>
              <label>Tilt [deg]: <input id="cam-tilt" type="number" step="0.01" value="0.0" /></label>
              <label>Heading [deg]: <input id="cam-heading" type="number" step="0.01" value="0.0" /></label>

              <label>Parent Length [m]: <input id="cam-length" type="number" step="0.001" value="5.100" /></label>
              <label>Parent Width [m]: <input id="cam-width" type="number" step="0.001" value="2.120" /></label>
              <label>Parent Height [m]: <input id="cam-height" type="number" step="0.001" value="1.490" /></label>
            </div>

            <!-- Right Column -->
            <div class="camera-col">
              <h3 class="camera-col-title">Basic</h3>

              <label>Horizontal Resolution [pixel]: <input id="cam-hres" type="number" step="1" value="800" /></label>
              <label>Vertical Resolution [pixel]: <input id="cam-vres" type="number" step="1" value="600" /></label>
              <label>Frame rate [Hz]: <input id="cam-fps" type="number" step="1" value="40" /></label>

              <label>Focal length [mm]: <input id="cam-focal" type="number" step="0.01" value="7.500" /></label>

              <h4 class="modal-subtitle">CCD</h4>
              <label>CCD size:
                <select id="cam-ccd">
                  <option value="1/4">1/4"</option>
                  <option value="1/3">1/3"</option>
                  <option value="1/2" selected>1/2"</option>
                  <option value="2/3">2/3"</option>
                  <option value="custom">Custom</option>
                </select>
              </label>

              <h4 class="modal-subtitle">Field of View</h4>
              <label>FoV Azimuth [deg]: <input id="cam-fov-az" type="number" step="0.01" value="46.21265" /></label>
              <label>FoV Elevation [deg]: <input id="cam-fov-el" type="number" step="0.01" value="35.48935" /></label>

              <h4 class="modal-subtitle">Rendering</h4>
              <label>Near Clip [m]: <input id="cam-near" type="number" step="0.01" value="0.10" /></label>
              <label>Far Clip [m]: <input id="cam-far" type="number" step="0.1" value="300.0" /></label>
            </div>

          </div>
        </div>

        <div class="modal-footer">
          <button id="cameraModalCancel" type="button">Cancel</button>
          <button id="cameraModalOk" type="button">OK</button>
        </div>
      </div>
    </div>

    <script type="module" src="dist/main.js"></script>
  </body>
</html>
